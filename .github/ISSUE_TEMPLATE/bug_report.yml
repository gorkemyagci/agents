name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, do not open an issue; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Ask "..."
        3. Approve the `...` tool call
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages or terminal output. Remove API keys and other secrets.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 22.12, zsh
    validations:
      required: true
